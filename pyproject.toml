[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ideias-em-rede"
version = "0.1.0"
description = "Pipeline do PublicHearingBR com enriquecimento pela API da Camara"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
ideias-em-rede = "ideias_em_rede.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

